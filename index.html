<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Termix" />
    <link rel="apple-touch-icon" href="icons/512x512.png" />
    <link rel="manifest" href="manifest.json" />
    <title>Termix</title>
    <style>
      .hide-scrollbar {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .skinny-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: #4a4a4a #1e1e21;
      }

      .skinny-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      .skinny-scrollbar::-webkit-scrollbar-track {
        background: #1e1e21;
      }

      .skinny-scrollbar::-webkit-scrollbar-thumb {
        background-color: #4a4a4a;
        border-radius: 3px;
        border: 1px solid #1e1e21;
      }

      .toolbar-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: #4a4a4a transparent;
      }

      .toolbar-scrollbar::-webkit-scrollbar {
        height: 3px;
      }

      .toolbar-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }

      .toolbar-scrollbar::-webkit-scrollbar-thumb {
        background-color: #4a4a4a;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <script>
      window.__TERMIX_BASE_PATH__ = "";
      // Start the signed-out login-config request while the app bundle is
      // still downloading, instead of serially after React mounts. One
      // aggregated request on purpose: parallel per-endpoint fetches here
      // would compete with the boot-critical downloads for HTTP/1.1
      // connections. Consumed one-shot by src/ui/lib/boot-prefetch.ts; any
      // failure falls back to the normal per-endpoint API calls.
      window.__TERMIX_LOGIN_CONFIG__ = (function () {
        if (location.protocol !== "http:" && location.protocol !== "https:") {
          return null;
        }
        var promise = fetch(
          (window.__TERMIX_BASE_PATH__ || "") + "/users/login-config",
          { headers: { Accept: "application/json" } },
        ).then(function (response) {
          if (!response.ok) throw new Error(String(response.status));
          return response.json();
        });
        promise.catch(function () {});
        return promise;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
